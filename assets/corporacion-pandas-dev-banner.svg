<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Corporación Pandas Dev</title>
  <desc id="desc">Panda tecnológico en una escena espacial retro con el texto Corporación Pandas Dev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset=".58" stop-color="#11133a"/>
      <stop offset="1" stop-color="#061d2a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
